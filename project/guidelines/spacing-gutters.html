<!-- @dsCard group="Spacing" viewport="700x175" subtitle="56 / 20 page gutters; grids sit nearly flush at 5px" name="Gutters & grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div style="display:flex;gap:26px">
<div><div style="display:flex;height:92px"><div style="width:56px;background:var(--blush-150)"></div><div style="width:150px;background:var(--surface-card)"></div><div style="width:56px;background:var(--blush-150)"></div></div><div class="n">Desktop gutter 56px</div></div>
<div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;width:180px;height:92px"><div style="background:var(--surface-card)"></div><div style="background:var(--surface-card)"></div><div style="background:var(--surface-card)"></div><div style="background:var(--surface-card)"></div></div><div class="n">Grid gutter 5px</div></div>
</div></body></html>
