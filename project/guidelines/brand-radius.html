<!-- @dsCard group="Brand" viewport="700x150" subtitle="Zero radius everywhere — only pins and stars are round" name="No radius" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div style="display:flex;gap:14px;align-items:center">
<div style="width:120px;height:74px;background:var(--surface-card);border:1px solid var(--rule-hairline)"></div>
<div style="width:120px;height:74px;background:var(--gradient-plum)"></div>
<span style="width:13px;height:13px;border-radius:50%;background:var(--mauve-500);box-shadow:0 0 0 5px rgba(167,106,120,.26)"></span>
<span style="font:600 15px/1 var(--font-sans);color:var(--gold-500);letter-spacing:.18em">★★★★★</span>
<span class="v">--radius: 0</span></div></body></html>
