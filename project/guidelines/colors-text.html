<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div class="row" style="align-items:flex-end">
<div class="sw"><div style="font:var(--body-lg);color:var(--text-strong)">Strong</div><div class="v">--text-strong · #3A2A2E</div></div>
<div class="sw"><div style="font:var(--body-lg);color:var(--text-body)">Body</div><div class="v">--text-body · #6d565c</div></div>
<div class="sw"><div style="font:var(--body-lg);color:var(--text-muted)">Muted</div><div class="v">--text-muted · #7a636a</div></div>
<div class="sw"><div style="font:var(--body-lg);color:var(--text-quiet)">Quiet</div><div class="v">--text-quiet · #8a7178</div></div>
<div class="sw"><div style="font:var(--body-lg);color:var(--text-accent)">Accent</div><div class="v">--text-accent · #A76A78</div></div></div></body></html>
