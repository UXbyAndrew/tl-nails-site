<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#A76A78"></div><div class="n">Mauve</div><div class="v">--mauve-500</div></div><div class="sw"><div class="chip" style="background:#5E3A44"></div><div class="n">Plum</div><div class="v">--plum-700</div></div><div class="sw"><div class="chip" style="background:#3A2A2E"></div><div class="n">Ink</div><div class="v">--ink-900</div></div><div class="sw"><div class="chip" style="background:#C9899A"></div><div class="n">Rose</div><div class="v">--rose-400</div></div><div class="sw"><div class="chip" style="background:#BE9A46"></div><div class="n">Gold</div><div class="v">--gold-500</div></div></div></body></html>
