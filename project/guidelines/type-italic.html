<!-- @dsCard group="Type" viewport="700x190" subtitle="One italic word per headline, in mauve — the only text ornament" name="Italic accent & quote" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div style="display:grid;gap:18px">
<div style="font:var(--display-2)">Twenty-two years of <span style="font-style:italic;color:var(--text-accent)">helping Tampa glow</span></div>
<p style="font:var(--quote);margin:0;color:var(--text-strong)">"It truly is a hidden gem — the vibe is on point."</p></div></body></html>
