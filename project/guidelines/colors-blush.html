<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#FBF4F1"></div><div class="n">Page</div><div class="v">--blush-50</div></div><div class="sw"><div class="chip" style="background:#F7EDE9"></div><div class="n">Wash</div><div class="v">--blush-100</div></div><div class="sw"><div class="chip" style="background:#F5DCE1"></div><div class="n">Blush</div><div class="v">--blush-150</div></div><div class="sw"><div class="chip" style="background:#F0E2DD"></div><div class="n">Soft</div><div class="v">--blush-200</div></div><div class="sw"><div class="chip" style="background:#F0DDD9"></div><div class="n">Wash 2</div><div class="v">--blush-250</div></div><div class="sw"><div class="chip" style="background:#EFD4DB"></div><div class="n">Hero end</div><div class="v">--blush-300</div></div></div></body></html>
