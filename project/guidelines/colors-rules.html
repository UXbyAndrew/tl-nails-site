<!-- @dsCard group="Colors" viewport="700x150" subtitle="Hairlines carry the structure" name="Rules" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div style="display:grid;gap:16px">
<div><div style="border-top:1px solid var(--rule-soft)"></div><div class="v" style="margin-top:5px">--rule-soft · rgba(58,42,46,.14) — header, dividers</div></div>
<div><div style="border-top:1px solid var(--rule-hairline)"></div><div class="v" style="margin-top:5px">--rule-hairline · rgba(58,42,46,.16) — rows, columns</div></div>
<div><div style="border-top:1px solid var(--rule-strong)"></div><div class="v" style="margin-top:5px">--rule-strong · rgba(58,42,46,.22) — form fields</div></div>
<div><div style="border-top:1px solid var(--rule-accent)"></div><div class="v" style="margin-top:5px">--rule-accent · #C9899A — quiet-link underline</div></div></div></body></html>
