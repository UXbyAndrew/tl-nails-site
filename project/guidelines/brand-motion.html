<!-- @dsCard group="Brand" viewport="700x175" subtitle="Slow, soft, one easing curve" name="Motion" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div style="display:grid;gap:9px;font:var(--body-sm);color:var(--text-body)">
<div><b style="font-weight:600">.25s</b> — colour &amp; background hover <span class="v">--dur-tint</span></div>
<div><b style="font-weight:600">.2s</b> — button lifts 2px <span class="v">--dur-lift</span></div>
<div><b style="font-weight:600">.6s</b> — image scales to 1.05 <span class="v">--dur-image</span></div>
<div><b style="font-weight:600">.85s</b> — section fades up 30px, 90ms stagger <span class="v">cubic-bezier(.22,.61,.36,1)</span></div>
<div><b style="font-weight:600">52s</b> — the one marquee, linear, paused on hover <span class="v">--marquee-duration</span></div></div></body></html>
