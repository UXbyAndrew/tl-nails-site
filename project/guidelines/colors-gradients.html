<!-- @dsCard group="Colors" viewport="700x170" subtitle="Two plum gradients, one hero, one footer wash" name="Gradients" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="height:82px;background:var(--gradient-hero)"></div><div class="n">Hero 168°</div><div class="v">--gradient-hero</div></div>
<div class="sw"><div class="chip" style="height:82px;background:var(--gradient-plum)"></div><div class="n">Band 140°</div><div class="v">--gradient-plum</div></div>
<div class="sw"><div class="chip" style="height:82px;background:var(--gradient-plum-panel)"></div><div class="n">Panel 150°</div><div class="v">--gradient-plum-panel</div></div>
<div class="sw"><div class="chip" style="height:82px;background:var(--gradient-footer)"></div><div class="n">Footer 165°</div><div class="v">--gradient-footer</div></div></div></body></html>
