<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div style="display:flex;gap:14px">
<div style="flex:1;height:200px;background-color:var(--surface-page);background-image:url(../assets/textures/petal-field-desktop-pink.svg);background-size:1440px 2600px;background-position:0 -300px;background-repeat:repeat-y"></div>
<div style="flex:1;height:200px;background-image:url(../assets/textures/petal-field-desktop-blush.svg),var(--gradient-plum);background-size:1440px 2600px,auto;background-position:0 -900px,center;background-repeat:repeat-y,no-repeat"></div>
</div></body></html>
