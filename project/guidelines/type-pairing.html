<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}

.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div style="max-width:520px">
<div style="font:var(--eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;color:var(--text-accent);margin-bottom:14px">The menu</div>
<div style="font:var(--display-2);margin-bottom:12px">First-rate services</div>
