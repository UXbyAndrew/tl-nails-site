<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Every interactive element holds 44px, padding notwithstanding" name="Tap target" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:56px;border:1px solid var(--rule-soft)}
.n{font:600 9px/1.4 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:7px}
.v{font:500 9px/1.4 var(--font-mono);color:var(--text-quiet)}</style></head><body><div style="display:flex;gap:12px;align-items:center">
<a style="display:inline-flex;align-items:center;min-height:44px;padding:0 26px;background:var(--mauve-500);color:#fff;font:var(--label);letter-spacing:var(--track-button);text-transform:uppercase">Book now</a>
<a style="display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border:1px solid var(--plum-700);color:var(--plum-700);font:var(--label);letter-spacing:var(--track-caps);text-transform:uppercase">Menu</a>
<span class="v">min-height:44px · --tap-min</span></div></body></html>
