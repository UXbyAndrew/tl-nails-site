<!-- @dsCard group="Components" viewport="700x430" subtitle="Header, petal field, framed imagery, dark bands, sticky bar" name="Layout" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--surface-page);color:var(--text-strong);font-family:var(--font-sans)}
a{color:inherit}
.lbl{font:600 9px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--text-quiet);margin:0 0 10px}
.grp{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap-min);border:0;border-radius:0;
font:var(--label);letter-spacing:var(--track-button);text-transform:uppercase;text-decoration:none;cursor:pointer;
transition:background var(--dur-tint),color var(--dur-tint),transform var(--dur-lift)}
.btn-primary{background:var(--mauve-500);color:#fff;padding:18px 34px;box-shadow:var(--shadow-button)}
.btn-primary:hover{background:var(--plum-700);transform:translateY(-2px)}
.btn-deep{background:var(--plum-700);color:#fff;padding:13px 26px}
.btn-deep:hover{background:var(--mauve-500)}
.btn-ghost{border:1px solid var(--plum-700);color:var(--plum-700);padding:13px 26px;background:transparent}
.btn-ghost:hover{background:var(--surface-tint-hover)}
.btn-light{background:var(--surface-page);color:var(--plum-700);padding:11px 18px}
.btn-light:hover{background:var(--blush-150)}
.btn.is-disabled{opacity:.45;pointer-events:none}
.link{display:inline-flex;align-items:center;min-height:var(--tap-min);font:600 11px/1 var(--font-sans);
letter-spacing:var(--track-caps);text-transform:uppercase;text-decoration:none;transition:color var(--dur-tint),opacity var(--dur-tint)}
.link-rule{border-bottom:1px solid var(--rule-accent);padding-bottom:6px}
.link-accent{color:var(--text-accent);font-size:12px}
.link-quiet{opacity:.55}.link-quiet:hover{opacity:1}
.link-underline{text-decoration:underline;text-underline-offset:5px}
.chip{display:inline-flex;align-items:center;min-height:var(--tap-min);padding:11px 18px;border:1px solid var(--rule-strong);
font:var(--label);letter-spacing:.06em;background:transparent;cursor:pointer;transition:background var(--dur-tint),color var(--dur-tint)}
.chip.on{background:var(--mauve-500);border-color:var(--mauve-500);color:#fff}
.field{width:100%;min-height:var(--tap-min);padding:16px;background:#fff;border:var(--border-field);border-radius:0;
font:500 14px var(--font-sans);color:var(--text-strong);outline:none}
.eyebrow{font:var(--eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;color:var(--text-accent)}
</style></head><body>

<div style="display:grid;gap:18px">
  <div style="border:1px solid var(--rule-soft)">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-bottom:1px solid var(--rule-soft)">
      <span style="font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--plum-700)">T&amp;L Nails</span>
      <div style="display:flex;gap:28px;font:var(--nav);letter-spacing:var(--track-nav);text-transform:uppercase">
        <a href="#" style="text-decoration:none;padding-bottom:4px;border-bottom:1px solid var(--mauve-500)">Home</a>
        <a href="#" style="text-decoration:none;opacity:.55">About</a>
        <a href="#" style="text-decoration:none;opacity:.55">Menu</a>
        <a href="#" style="text-decoration:none;opacity:.55">Locations</a></div>
      <a class="btn btn-deep" href="#" style="padding:11px 20px">Book now</a></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
    <div style="height:160px;background-color:var(--surface-page);background-image:url(../../assets/textures/petal-field-desktop-pink.svg);background-size:1440px 2600px;background-position:-120px -300px;background-repeat:repeat-y;border:1px solid var(--rule-hairline)"></div>
    <div style="height:160px;overflow:hidden"><div style="height:100%;background:var(--hatch),var(--gradient-placeholder);display:flex;align-items:flex-end;padding:14px">
      <span style="font:500 10px/1 var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--plum-700);opacity:.65">salon interior</span></div></div>
    <div style="height:160px;display:flex;align-items:center;padding:20px;color:var(--text-on-dark);
      background-image:url(../../assets/textures/petal-field-desktop-blush.svg),var(--gradient-plum);
      background-repeat:repeat-y,no-repeat;background-position:-200px -900px,center;background-size:1440px 2600px,auto">
      <span style="font:var(--quote)">Treat yo' self</span></div>
  </div>
  <div style="max-width:390px;border:1px solid var(--rule-soft)">
    <div style="display:flex;gap:8px;padding:12px 14px;background:rgba(251,244,241,.97);border-top:1px solid var(--rule-hairline);box-shadow:var(--shadow-sticky)">
      <a href="#" style="flex:1.9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tap-min);padding:11px 8px;background:var(--mauve-500);color:#fff;text-decoration:none">
        <span style="font:600 11px/1 var(--font-sans);letter-spacing:var(--track-caps);text-transform:uppercase">Book an appointment</span>
        <span style="font:500 10px/1 var(--font-sans);opacity:.8">(813) 304-0330</span></a>
      <a href="#" style="flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap-min);border:1px solid var(--plum-700);color:var(--plum-700);font:600 11px var(--font-sans);letter-spacing:var(--track-nav);text-transform:uppercase;text-decoration:none">Menu</a>
    </div>
  </div>
</div>
</body></html>
