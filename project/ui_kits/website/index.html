<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>T&amp;L Nails — website UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--canvas);font-family:var(--font-sans)}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:baseline;gap:18px;padding:14px 22px;background:var(--ink-900);color:var(--blush-50);flex:none}
  header b{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.16em;text-transform:uppercase}
  header span{font:400 12px/1.5 var(--font-sans);opacity:.65}
  header a{margin-left:auto;font:600 10px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--blush-150);text-decoration:none;border-bottom:1px solid var(--rose-400);padding-bottom:4px}
  iframe{flex:1;width:100%;border:0;background:var(--canvas)}
</style>
</head>
<body>
  <header>
    <b>T&amp;L Nails</b>
    <span>Five pages, desktop 1440 and mobile 390 — scroll to move between them.</span>
    <a href="../../TL Nails Site.dc.html" target="_blank">Open full size</a>
  </header>
  <iframe src="../../TL Nails Site.dc.html" title="T&L Nails website"></iframe>
</body>
</html>
